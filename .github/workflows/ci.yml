name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported pair (mix.exs floor) and newest, plus the
          # released Elixir versions in between on their native OTP.
          - elixir: '1.18'
            otp: '27'
          - elixir: '1.19'
            otp: '28'
          - elixir: '1.20'
            otp: '28'
          - elixir: '1.20'
            otp: '29'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: deps
          key: deps-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: deps-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test

      # Excluded from `mix test` by tag (see test/test_helper.exs): many
      # clients and messages over real sockets, asserting completeness. Runs
      # on every matrix pair because socket behaviour is where OTP versions
      # differ.
      - name: Run load test
        run: mix test --include load test/mqttx/load_test.exs

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20'
          otp-version: '29'

      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: deps
          key: deps-${{ runner.os }}-29-1.20-${{ hashFiles('**/mix.lock') }}
          restore-keys: deps-${{ runner.os }}-29-1.20-

      - name: Cache PLT
        uses: actions/cache@v6
        with:
          path: _build/dev/*.plt
          key: plt-${{ runner.os }}-29-1.20-${{ hashFiles('**/mix.lock') }}
          restore-keys: plt-${{ runner.os }}-29-1.20-

      - name: Install dependencies
        run: mix deps.get

      - name: Run Dialyzer
        run: mix dialyzer

  publish:
    name: Publish to Hex.pm
    runs-on: ubuntu-latest
    needs: [test, dialyzer]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20'
          otp-version: '29'

      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: deps
          key: deps-${{ runner.os }}-29-1.20-${{ hashFiles('**/mix.lock') }}
          restore-keys: deps-${{ runner.os }}-29-1.20-

      - name: Install dependencies
        run: mix deps.get

      - name: Publish to Hex.pm
        run: mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
